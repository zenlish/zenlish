<style>
:root{--blue:#5146e5;--blue2:#eef0ff;--ink:#20283a;--muted:#6e788b;--line:#e7eaf0;--bg:#f4f6fa;--white:#fff;--orange:#f97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}.app{max-width:1600px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 8px 40px #25345a12;display:grid;grid-template-columns:66px 280px minmax(400px,1fr) 285px}

.searchbox .si{position:absolute;left:13px;color:var(--muted);pointer-events:none}
.searchbox .kbd{position:absolute;right:11px;font:600 11px/1 ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--surface);pointer-events:none}
.searchbox .sx{position:absolute;right:7px;display:none;width:26px;height:26px;border:0;border-radius:50%;background:var(--blue2);color:var(--blue);cursor:pointer;font-size:15px;line-height:1;place-items:center}
.searchbox.has .kbd{display:none}.searchbox.has .sx{display:grid}
@media(hover:none){.searchbox .kbd{display:none}.sr-keys{display:none}}
@media(max-width:720px){.searchbox{width:auto;flex:1;min-width:0}.searchbox .search{padding-left:36px}}
@media(min-width:721px){.topbar>div:first-child{flex:1 1 0;min-width:0}.top-actions{flex:0 0 auto}}
.crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#themeBtn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:17px;border-radius:13px;flex:none}
.searchres{position:fixed;z-index:35;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 48px #1c223624,0 2px 8px #1c22360f;overflow:hidden;animation:fade .15s both}
.searchres[hidden]{display:none}
.sr-list{overflow:auto;padding:6px;overscroll-behavior:contain}
.sr-h{padding:10px 12px 4px;font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.sr{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--ink);text-decoration:none}
.sr.active,.sr:hover{background:var(--blue2)}
.sr-top{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.sr-t{display:block;font-weight:650;font-size:14px;line-height:1.35}
.sr-s{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.5}
mark,mark.hl{background:#fde68a;color:#1c2236;border-radius:3px;padding:0 2px}
mark.hl{box-shadow:0 0 0 2px #fde68a}
.sr-foot{border-top:1px solid var(--line);padding:8px 14px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.sr-empty{padding:28px 18px;text-align:center;color:var(--muted);line-height:1.6}.sr-empty b{color:var(--ink)}
.sr-chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 12px 10px}
.sr-chip{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.sr-chip:hover{border-color:var(--blue);color:var(--blue)}
.sr-tip{padding:0 14px 12px;font-size:12px;color:var(--muted)}

/* ===== Giao diện ===== */
.content{max-width:920px}
.detail-card{scroll-margin-top:90px}
.rprog{position:absolute;left:0;right:0;bottom:-1px;height:3px;pointer-events:none;opacity:0;transition:opacity .2s}
.rprog.on{opacity:1}.rprog i{display:block;height:100%;width:0;background:var(--grad);border-radius:0 3px 3px 0}
.totop{position:fixed;right:22px;bottom:22px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--blue);box-shadow:var(--shadow,0 6px 18px #1c223622);font-size:18px;cursor:pointer;transition:transform .18s}
.totop:hover{transform:translateY(-2px)}.totop[hidden]{display:none}
@media(max-width:720px){.totop{right:14px;bottom:calc(76px + env(safe-area-inset-bottom))}}
.toc{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.toc-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:650;cursor:pointer;transition:.18s}
.toc-chip:hover{border-color:var(--blue);color:var(--blue)}.toc-chip .chip{margin-left:6px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;color:var(--ink);box-shadow:var(--shadow,0 4px 14px #1c22360a);transition:transform .18s,border-color .18s}
.pg small{color:var(--muted);font-weight:700;font-size:12px}.pg b{font-size:14px;line-height:1.35}
.pg.next{text-align:right;grid-column:2}
.pg:hover{border-color:#cfc9ff;transform:translateY(-2px)}
@media(max-width:560px){.pager{grid-template-columns:1fr}.pg.next{grid-column:auto}}
/* ===== Tài liệu nhanh ===== */
.ph{display:flex;align-items:center;justify-content:space-between}
.ph a{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}.ph a:hover{text-decoration:underline}
#quickResources{display:grid;gap:9px}
.qr{--c:#5b4bf0;--cb:#eeecff;display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--line);border-radius:15px;background:var(--surface);text-decoration:none;color:var(--ink);box-shadow:0 2px 8px #1c22360a;transition:transform .18s,border-color .18s,box-shadow .18s;animation:rise .4s both;animation-delay:calc(var(--i,0)*.05s + .1s)}
.qr:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 10px 24px color-mix(in srgb,var(--c) 18%,transparent)}
.qr-ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--cb);display:grid;place-items:center;font-size:19px}
.qr-tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.qr-tx b{font-size:13px;line-height:1.3;font-weight:650}
.qr-tx small{font-size:11.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qr-tx em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.2px;color:var(--c)}
.qr .go{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--cb);color:var(--c);opacity:0;transform:translateX(-4px);transition:.18s}
.qr:hover .go,.qr:focus-visible .go{opacity:1;transform:none}
.qr.c-red{--c:#e11d48;--cb:#ffe9ee}.qr.c-green{--c:#15803d;--cb:#e6f6ec}.qr.c-violet{--c:#7c3aed;--cb:#f0e9ff}.qr.c-orange{--c:#c2570c;--cb:#fff1e6}
.qr.c-blue{--c:#2563eb;--cb:#e7f0ff}.qr.c-teal{--c:#0f766e;--cb:#e0f5f2}.qr.c-pink{--c:#db2777;--cb:#fde8f3}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.on{background:var(--grad);border-color:transparent;color:#fff}

/* ===== Hiệu ứng đổi giao diện ===== */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .7s ease,color .7s ease,border-color .7s ease,box-shadow .7s ease,fill .7s ease!important}
#themeBtn{overflow:hidden}

/* ===== Nút bấm: loe tròn từ điểm chạm (cùng kiểu đổi sáng/tối) ===== */
@property --r{syntax:'<percentage>';inherits:false;initial-value:-10%}
@property --rr{syntax:'<percentage>';inherits:false;initial-value:-10%}
@property --ra{syntax:'<percentage>';inherits:false;initial-value:0%}
:is(.toolbar-btn,.nav-item,.lesson-link,.wk summary,.row,.resource,.fchip,.toc-chip,.pg,.rail button,.sr-chip,.qr,.sr,.panel-link,.lk-copy){--x:50%;--y:50%;--px:50%;--py:50%;
 background-image:radial-gradient(circle at var(--px) var(--py),color-mix(in srgb,var(--blue) var(--ra),transparent) var(--rr),transparent calc(var(--rr) + 10%)),radial-gradient(circle at var(--x) var(--y),var(--blue2) var(--r),transparent calc(var(--r) + 10%));
 transition:--r 1s cubic-bezier(.4,0,.2,1),transform .18s,border-color .18s,color .18s,box-shadow .18s,background-color .18s}

 :is(.toolbar-btn,.nav-item,.lesson-link,.wk summary,.row,.resource,.fchip,.toc-chip,.pg,.rail button,.sr-chip,.qr,.sr,.panel-link,.lk-copy):hover{--r:100%}
 :is(.row,.nav-item:not(.active),.lesson-link:not(.active),.wk:not([open]) summary,.sr:not(.active),.rail button:not(.active)):hover{background-color:transparent}
 :is(.toolbar-btn,.fchip:not(.on),.toc-chip,.lk-copy):hover{background-color:var(--surface,#fff)}
}

tent": "I. Lý thuyết \nHọc viên xem video lý thuyết Từ loại & Cấu trúc câu và ghi chép lại nội dung quan trọng vào vở \n\n1. Giới thiệu tổng quan về các Từ loại \nHọc viên đọc kỹ về tổng quan các Từ loại sau:  Danh từ, Đại từ, Động từ, Tính từ, Trạng từ, Giới từ, Liên từ,  Hạn định từ\n\n2. Phân biệt cụm từ và mệnh đề\nSự khác nhau về cấu tạo của Cụm từ và Mệnh đề, phân tích các ví dụ với các chức năng để làm rõ:\n- Khi cùng có chức năng danh từ (đứng sau động từ)\n- Khi cùng có chức năng tính từ (bổ nghĩa cho danh từ)\n- Khi cùng có chức năng trạng từ (bổ nghĩa cho cả câu)\n\n3. Giới thiệu 5 cấu trúc cơ bản\nHọc viên đọc kỹ về 5 dạng cấu trúc cơ bản sau đây):\n1. S + V (Chủ ngữ + Động từ)\n2. S + V + O (Chủ ngữ + Động từ + Tân ngữ)\n3. S + V + C (Chủ ngữ + Động từ + Bổ ngữ)\n4. S + V + O + O (Chủ ngữ + Động từ + Tân ngữ gián tiếp + Tân ngữ trực tiếp)\n5. S + V + O + C (Chủ ngữ + Động từ + Tân ngữ + Bổ ngữ)\n\nII. Thực hành\nHọc viên Làm và chữa bài Ex1, Ex2, Ex3 Bài tập thực hành Lesson 1\n", "deadline": "", "url": "https://drive.google.com/file/d/1fHk19Lj_G4P9RVx7wqbA6ah-vAfBgo23/view?usp=drive_link"}, {"row": 15, "week": "1.0", "session": "", "homework": "BTVN 1", "title": "RC 1: Part 5: Từ loại & Cấu trúc câu", "kind": "homework", "content": " \nI. LC (35 phút)\n1. Nộp ảnh chụp bài Làm + Chữa Part 1 + Part 2 (BTVN 1)\n- Bước 1 - Làm bài: Nghe 1 lần, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập\n\n- Bước 2 - Chữa bài: Vào Bộ video chữa chi tiết, xem video giải thích chi tiết đồng thời mở phần đáp án cuối sách để:\n+ Tra phiên âm và dịch nghĩa từ mới của toàn bộ câu hỏi & đáp án\n+ Part 1: Gạch từ khóa sai nằm trong 3 đáp án sai (sai chủ thể/ bối cảnh/ hành động/ trang phục/ yếu tố khác)\n+ Part 2: Highlight từ khóa ở câu hỏi và dịch ngắn gọn câu hỏi \n                Phân tích đáp án: đáp đúng là trả lời trực tiếp/ gián tiếp, đáp án sai trả lời cho câu hỏi gì?\n\n2. Nộp video Nghe - nhắc lại tiếng Anh - dịch nghĩa sang tiếng Việt cả câu hỏi và 3 đáp án, áp dụng với 10 câu (15, 17, 20, 21, 22, 25, 26, 27, 29, 31)\n- Bước 1 - Luyện tập: \n+ TEXT: Bật file nghe và nhắc lại từng câu có nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n+ NO TEXT: Bật file nghe và nhắc lại từng câu KHÔNG nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n\n- Bước 2 - Quay video: Quay video nghe, nhắc lại và dịch nghĩa từng câu (đảm bảo tiêu chí: 1 HƠI, NHẮC LẠI TIẾNG ANH & DỊCH TIẾNG VIỆT, KHÔNG NHÌN GIẤY)\n\nII. RC (95 phút)\n1. Nộp ảnh chụp bài Chữa + Nộp video dịch 15 câu phân tích cấu trúc câu theo S, V, O, C, M (BTVN 1)\n- Bước 1 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết, và chữa theo + ghi chú vào giáo trình - 15 phút\n- Bước 2 - Luyện dịch toàn bộ các câu - 15 phút\n- Bước 3 - Quay video dịch toàn bộ các câu. Lưu ý: Chỉ tay vào giáo trình bản PDF trắng (không take note) - 10 phút\n\n2. Nộp ảnh chụp sau khi đã xem video hướng dẫn Động từ và ghi chép lại nội dung quan trọng vào vở - 30 phút\n\n", "deadline": "23h ngày", "url": "https://drive.google.com/drive/folders/1OQx1D3JEB7v5P4XDfAv6aqJTOn3n8VYz?usp=drive_link"}, {"row": 16, "week": "1.0", "session": "Lesson 2", "homework": "", "title": "LC 1: Part 1&2: Luyện đề", "kind": "lesson", "content": "1. Giới thiệu về Part 1 bài thi TOEIC Listening\n- Part 1 của bài thi TOEIC Listening bao gồm 6 hình ảnh, mỗi hình ảnh đi kèm với 4 lựa chọn đáp án khác nhau. Nhiệm vụ của thí sinh là xem xét các hình ảnh, lắng nghe và chọn lựa mô tả chính xác nhất về mỗi hình ảnh. \n- Các dạng câu hỏi mô tả tranh Part 1:\n+ Tả người\n+ Tả vật\n+ Hỗn hợp (cả người và vật)\n- Mục tiêu số câu đúng tại lớp Camp Bomb: 4/6 câu\n- Hướng dẫn phân tích tranh theo 5 yếu tố:\n+ Chủ thể: trả lời câu hỏi ai ở trong tranh?\n+ Hành động: trả lời câu hỏi nhân vật trong tranh đang làm gì?\n+ Bối cảnh: trả lời câu hỏi bức tranh được chụp ở đâu?\n+ Trang phục: trả lời câu hỏi người trong tranh đang mặc/ đeo/ đội gì?\n+ Từ vựng liên quan: các vật thể khác xuất hiện trong bức tranh.\nHọc viên có thể xem video hướng dẫn Part 1 tại đây\n\n2. Giới thiệu về Part 2 bài thi TOEIC Listening\n- TOEIC Listening Part 2 sẽ gồm 25 câu hỏi. Mỗi câu sẽ có lần lượt 1 câu hỏi và 3 đáp án khác nhau. Nhiệm vụ của thí sinh là phải chọn ra câu trả lời đúng nhất dựa trên những thông tin đã được nghe trong đoạn hội thoại. Đối với Part 2, câu hỏi và câu trả lời tương ứng sẽ không được in sẵn trong đề thi.\n- Các dạng câu hỏi thường gặp trong đề thi Part 2:\n+ Câu hỏi Wh- (what, when, where, who, whom, which, whose, why, how)\n+ Câu hỏi Yes/ No\n+ Câu trần thuật (statements)\n- Mục tiêu số câu đúng tại lớp Camp Bomb: 18/25 câu\n- Yếu tố quan trọng nhất trong Part 2: NGHE HIỂU ĐƯỢC CÂU HỎI\nHọc viên có thể xem video hướng dẫn Part 2 tại đây \n\n3. 5 bước luyện nghe Part 1,2\nTrong suốt quá trình học Khóa học Camp Bomb, 5 BƯỚC luyện tập PART 2 sau đây sẽ được sử dụng xuyên suốt, HỌC VIÊN cần lưu ý đọc kĩ trước khi luyện tập.\nBước 1: Nghe và chọn đáp án. \nBước 2: Check đáp án, đánh dấu các câu sai.\nBước 3: Tra phiên âm và dịch nghĩa tất cả các từ mới và đọc bản dịch.\nBước 4: LUYỆN TẬP NGHE & NHẮC LẠI 1 HƠI.\nBước này được chia làm 2 bước nhỏ:\n- Bước 4.1. Nhìn text nghe và nhắc lại 1 HƠI (cả tiếng Anh và tiếng Việt), nhớ là 1 HƠI chứ ko được ngắt quãng, vì như vậy là không trôi chảy, nếu đọc không trôi chảy 1 hơi thì KHÔNG THỂ NGHE ĐƯỢC, câu hỏi nói nhanh thậm chí là rất nhanh nên ta phải dùng chiêu này để đôi tai nghe được.\nTrường hợp câu dài quá thì phải chia câu đó làm 2 vế, mỗi vế đọc đi đọc lại 10 lần (1 HƠI), sau đó ghép lại thành 1 câu và đọc 20 lần (1 HƠI), đọc được như audio thì càng tốt, nhưng cứ nghe và nhắc lại 1 HƠI là chính xác.\n- Bước 4.2. KHÔNG NHÌN TEXT nghe và nhắc lại 1 HƠI (cả tiếng Anh và tiếng Việt) hiểu hết 100%\nĐây là bước khó khăn nhất và mất nhiều thời gian nhất nhưng sẽ giúp các em NGHE HIỂU ĐÚNG BẢN CHẤT, chứ không phải là nghe bắt key hay mẹo rồi chọn bừa, nếu không hiểu được thì có làm bao nhiêu đề, có học bao nhiêu lâu cũng KHÔNG LÊN vì thế bình tĩnh nha.\nBước 5: QUAY VIDEO nghe nhắc lại tiếng Anh + dịch nghĩa tiếng Việt (Câu khó, câu không chắc chắn).\n\n4. Thực hành\nNộp ảnh chụp bài Làm + Chữa Part 1, 2 trong Lesson 1 - Listening\n- Bước 1 - Làm bài: Nghe 1 lần, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập\n\n- Bước 2 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết đồng thời mở phần đáp án cuối sách để:\n+ Tra phiên âm và dịch nghĩa từ mới của toàn bộ câu hỏi & đáp án\n+ Part 1: Gạch từ khóa sai nằm trong 3 đáp án sai (sai chủ thể/ bối cảnh/ hành động/ trang phục/ yếu tố khác)\n+ Part 2: Highlight từ khóa ở câu hỏi và dịch ngắn gọn câu hỏi \n                Phân tích đáp án: đáp đúng là trả lời trực tiếp/ gián tiếp, đáp án sai trả lời cho câu hỏi gì?\n", "deadline": "", "url": "https://drive.google.com/file/d/1QQk-YAVfHH-ykDoTETbhJuNp-klZwxUV/view?usp=sharing"}, {"row": 17, "week": "1.0", "session": "", "homework": "BTVN 2", "title": "LC 1: Part 1&2: Luyện đề", "kind": "homework", "content": "I. LC (60 phút)\n1. Nộp ảnh chụp phần chữa Part 1 + Part 2 (BTVN 2) (Áp dụng với tối thiểu 10 câu sai/khó)\nVào Tập tin, xem video giải thích chi tiết đồng thời mở phần đáp án cuối sách để:\n+ Tra phiên âm và dịch nghĩa từ mới của toàn bộ câu hỏi & đáp án\n+ Part 1: Gạch từ khóa sai nằm trong 3 đáp án sai (sai chủ thể/ bối cảnh/ hành động/ trang phục/ yếu tố khác)\n+ Part 2: Highlight từ khóa ở câu hỏi và dịch ngắn gọn câu hỏi \n                Phân tích đáp án: đáp đúng là trả lời trực tiếp/ gián tiếp, đáp án sai trả lời cho câu hỏi gì?\n\n2. Nộp video Nghe - nhắc lại tiếng Anh - dịch nghĩa sang tiếng Việt cả câu hỏi và 3 đáp án, áp dụng với 10 câu (16, 18, 19, 21, 22, 24, 27, 28, 29, 30)\n- Bước 1 - Luyện tập: \n+ TEXT: Bật file nghe và nhắc lại từng câu có nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n+ NO TEXT: Bật file nghe và nhắc lại từng câu KHÔNG nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n\n- Bước 2 - Quay video: Quay video nghe, nhắc lại và dịch nghĩa từng câu (đảm bảo tiêu chí: 1 HƠI, NHẮC LẠI TIẾNG ANH & DỊCH TIẾNG VIỆT, KHÔNG NHÌN GIẤY)\n\nII. RC (90 phút)\n1. Nộp ảnh chụp bài Làm + Chữa + Nộp video dịch 15 câu phân tích cấu trúc câu theo S, V, O, C, M (BTVN 2)\n- Bước 1 - Làm bài: Phân tích thành phần câu theo S, V, O, C, M trong vòng tối đa 15 phút, không sử dụng từ điển hay công cụ hỗ trợ - 15 phút\n- Bước 2 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình - 15 phút\n- Bước 3 - Luyện dịch toàn bộ các câu - 15 phút\n- Bước 4 - Quay video dịch toàn bộ các câu. Lưu ý: Chỉ tay vào giáo trình bản PDF trắng (không take note) - 5 phút\n", "deadline": "23h ngày", "url": "https://drive.google.com/drive/folders/1vx3oj1FiQ6yyQ6bk0O0d44h_3h5P4uwJ?usp=drive_link"}, {"row": 18, "week": "1.0", "session": "Lesson 3", "homework": "", "title": "RC 2: Part 5: Động từ", "kind": "lesson", "content": "I. Lý thuyết \nHọc viên xem video lý thuyết Động từ và ghi chép lại nội dung quan trọng vào vở \n1. Phân tích 4 loại động từ\n+ Động từ thường (Regular & Irregular Verbs)\n+ Trợ động từ (Auxiliary Verbs: be, do, have)\n+ Động từ khuyết thiếu (Modal Verbs: can, could, may, might, must, shall, should, will, would)\n+ Linking Verbs (seem, become, appear, taste, feel, look, sound, etc.)\n\n2. Tổng quan 9 thì trong bài thi TOEIC\n+ Hiện tại đơn, Hiện tại tiếp diễn, Hiện tại hoàn thành.\n+ Quá khứ đơn, Quá khứ tiếp diễn, Quá khứ hoàn thành.\n+ Tương lai đơn, Tương lai gần, Tương lai hoàn thành.\n\n3. Giới thiệu về câu Bị động\n- Công thức chung của câu chủ động và câu bị động\n- Ví dụ chuyển đổi từ câu chủ động sang câu bị động \n- Bảng chuyển đổi câu bị động của các thì trong Tiếng Anh \n- Luyện tập với 10 câu bài tập thực hành của Câu bị động\n\nII. Thực hành\n Nộp ảnh chụp giáo trình phần làm 20 câu Bài tập thực hành Động từ trong Lesson 2 - Reading \n- Bước 1: Chọn đáp án trong thời gian tối đa 20 phút, không sử dụng từ điển hay công cụ hỗ trợ - 20 phút\n- Bước 2: Đếm số câu đú Chức năng của Giới từ trong câu \n\n2. Phân loại các loại Giới từ trong TOEIC \n-  Giới từ chỉ thời gian: in, on, at, before, after, since...\n- Giới từ chỉ nơi chốn: in, on, at, above, under, between...\n-  Giới từ chỉ phương hướng: to, into, onto, out of...\n- Giới từ chỉ nguyên nhân & phương tiện: because of, due to, by, with...\n\n3. 3 bước luyện tập về Giới từ trong Part 5 TOEIC \n- Cách sử dụng Giới từ trước danh từ.\n- Nhận diện Giới từ đi kèm với động từ/cụm động từ cố định.\n- Phân tích cách sử dụng Giới từ trong cụm giới từ bổ sung nghĩa cho câu.\n\nII. Thực hành \n Nộp ảnh chụp giáo trình phần làm 20 câu Bài tập thực hành Giới từ & Cụm giới từ trong Lesson 5 - Reading\n- Bước 1: Chọn đáp án trong thời gian tối đa 20 phút, không sử dụng từ điển hay công cụ hỗ trợ - 20 phút\n- Bước 2: Đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 5 phút\n- Bước 3: Chữa bài: Vào Tập tin,  xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình\n", "deadline": "", "url": "https://drive.google.com/file/d/1lbV_OBB8wgyHUf36xcLlQOs4KFHJcCm7/view?usp=drive_link"}, {"row": 29, "week": "3.0", "session": "", "homework": "9.0", "title": "RC 5: Part 5: Giới từ", "kind": "homework", "content": "I. LC (70 phút)\n1. Nộp ảnh chụp bài Làm + Chữa Part 1 + Part 2 (BTVN 9) \n- Bước 1 - Làm bài: Nghe 1 lần, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập\n\n- Bước 2 - Chữa bài (Áp dụng với tối thiểu 10 câu sai/khó): Vào Tập tin, xem video giải thích chi tiết đồng thời mở phần đáp án cuối sách để:\n+ Tra phiên âm và dịch nghĩa từ mới của toàn bộ câu hỏi & đáp án\n+ Part 1: Gạch từ khóa sai nằm trong 3 đáp án sai (sai chủ thể/ bối cảnh/ hành động/ trang phục/ yếu tố khác)\n+ Part 2: Highlight từ khóa ở câu hỏi và dịch ngắn gọn câu hỏi \n                Phân tích đáp án: đáp đúng là trả lời trực tiếp/ gián tiếp, đáp án sai trả lời cho câu hỏi gì?\n\n2. Nộp video Nghe - nhắc lại tiếng Anh - dịch nghĩa sang tiếng Việt cả câu hỏi và 3 đáp án, áp dụng với 10 câu bất kỳ\n- Bước 1 - Luyện tập: \n+ TEXT: Bật file nghe và nhắc lại từng câu có nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n+ NO TEXT: Bật file nghe và nhắc lại từng câu KHÔNG nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n\n- Bước 2 - Quay video: Quay video nghe, nhắc lại và dịch nghĩa từng câu (đảm bảo tiêu chí: 1 HƠI, NHẮC LẠI TIẾNG ANH & DỊCH TIẾNG VIỆT, KHÔNG NHÌN GIẤY)\n\nII. RC (105 phút)\n1. Nộp ảnh chụp bài Chữa + Nộp video dịch 20 câu Bài tập Giới từ (BTVN 9)\n- Bước 1 - Chữa bài: Vào Tập tin của Khóa học trên Canvas LMS, xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình (Áp dụng với tối thiểu 10 câu sai/khó) - 20 phút\n- Bước 2 - Luyện dịch toàn bộ các câu - 30 phút\n- Bước 3 - Quay video dịch toàn bộ các câu. Lưu ý: Chỉ tay vào giáo trình bản PDF trắng (không take note) - 10 phút\n\n2. Nộp ảnh chụp sau khi đã xem video hướng dẫn Liên từ và ghi chép lại nội dung quan trọng vào vở - 20 phút\n", "deadline": "23h ngày", "url": "https://drive.google.com/drive/folders/1W2GROh2YUIrHOOQP39izKMmRuteiViIX?usp=drive_link"}, {"row": 30, "week": "3.0", "session": "Lesson 8", "homework": "", "title": "LC 3: Part 3 (1): Luyện đề", "kind": "lesson", "content": "1. Giới thiệu Part 3\n1.1. Cấu trúc Part 3:\n- Gồm 13 đoạn hội thoại, mỗi đoạn có 3 câu hỏi. Mục tiêu: 25/39 câu\n- 5 dạng câu hỏi phổ biến:\n+ Dạng 1: Hỏi về ý chính (Main Idea): Hỏi về mục đích chính của đoạn hội thoại hoặc bài nói.\n+ Dạng 2: Hỏi chi tiết (Details): Hỏi về các thông tin cụ thể như ngày, giờ, địa điểm, hoặc tên.\n+ Dạng 3: Hỏi suy luận (Inference): Hỏi về thông tin gián tiếp, yêu cầu suy luận từ những gì được nghe.\n+ Dạng 4: Hỏi về chức năng (Function/Purpose): Hỏi về lý do cụ thể của lời nói trong đoạn hội thoại hoặc bài nói.\n+ Dạng 5: Hỏi về hình ảnh (Chart/Graph Questions): Liên kết thông tin trong đoạn hội thoại với biểu đồ hoặc lịch trình đi kèm.\n1.2. Các chủ đề nội dung thường gặp:\n+ Công việc: Hội thoại về lịch họp, dự án, khách hàng.\n+ Cuộc sống hằng ngày: Đặt chỗ nhà hàng, mua vé, gọi dịch vụ.\n+ Vấn đề cần giải quyết: Trục trặc kỹ thuật, phàn nàn, thay đổi lịch trình.\n+ Biểu đồ: Lịch họp, hóa đơn, danh sách công việc.\n\n2. 6 bước luyện nghe Part 3\nTrong suốt quá trình học Khóa học Camp Bomb, 6 BƯỚC luyện nghe PART 3 sau đây sẽ được sử dụng xuyên suốt, Học viên cần lưu ý đọc kĩ trước khi luyện tập.\nBước 1: Dịch câu hỏi và câu trả lời để đảm bảo BIẾT HẾT và HIỂU HẾT.\nBước 2: Nghe và chọn đáp án.\nBước 3: Tra phiên âm từ mới hoặc có nối âm thì note lại.\nBước 4: Dịch để HIỂU HẾT nội dung của cả đoạn hội thoại (có file mềm dịch sẵn rồi chỉ việc đọc lại thôi)\nBước 5: LUYỆN TẬP HỌC THUỘC LÒNG\n- 5.1 Nhìn TEXT, Nghe và đọc lại từng câu trôi chảy (20 lần/ câu) cho tới khi thuộc và hiểu mà không cần nhìn text => học thuộc từng lời thoại => học thuộc cả đoạn hội thoại.\n- 5.2 Nghe lại 1 lần nữa KHÔNG NHÌN TEXT để đảm bảo hiểu hết 100% (nếu chưa nghe hiểu hết thì quay lại B3, 4, 5.1)\nBước 6: QUAY VIDEO: Quay video học thuộc lòng đoạn Part 3 bằng tiếng Anh (Không cần bật file âm thanh)\nBí mật: 10 đoạn đầu tiên học rất lâu, thậm chí là phải mất 1 tiếng mới thuộc, nhưng sau 10 đoạn thì chỉ mất 20 - 30p. Muốn được 450 - 500 thì phải học thuộc 30 đoạn, 600 thì 40 đoạn, 700 - trên 800 thì phải học chiến thuật khác ở lớp Submarine mới giải quyết được, vì lúc đó trình độ cao mới theo được\n\n3. Thực hành\nNộp ảnh chụp bài Làm + Chữa Bài thực hành Part 3 trong Lesson 3 - Listening \n- Bước 1 - Làm bài: Nghe 1 lần, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 20 phút\n- Bước 2 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết (Áp dụng với tối thiểu 6 đoạn sai nhiều nhất) - 50 phút\n+ Highlight từ khóa ở câu hỏi (Từ để hỏi + S + V)\n+ Tra phiên âm & nghĩa từ mới của câu hỏi & đáp án vào giáo trình\n+ Mở phần đáp án cuối giáo trình -> Highlight, tra phiên âm, dịch nghĩa từ mới\n+ Nghe lại audio và CHIA CỤM + ĐÁNH DẤU CHỖ NỐI ÂM \n+ Ghi rõ keywords để trả lời cho câu hỏi bên cạnh ng nhân vật đang nói chuyện -> hiểu mạch chuyện\n• Xác định vị trí của câu hỏi hàm ý (dấu ngoặc kép) -> đọc đúng đến vị trí đó -> xử lý luôn (không được đọc thêm bất kỳ câu nào ở sau)\n- Bước 3: Đọc dịch và xác dịnh dạng câu hỏi\n3.1. Dạng câu hỏi thông tin chi tiết: Xác định keyword của câu hỏi\n-> tìm keyword/ từ đồng nghĩa với keyword trên bài đọc -> loại trừ/ đọc hiểu để chọn đáp án đúng\n3.2. Dạng câu hỏi ý chính/ suy luận: Dựa vào phần tóm tắt văn bản (thông tin thường nằm ở đoạn đầu) -> đọc từng đáp án và loại trừ từ khóa SAI\n\nII. Thực hành \nNộp ảnh chụp giáo trình phần làm 6 đoạn Bài tập thực hành Part 7 trong Lesson 10 - Reading\n- Bước 1: Chọn đáp án trong thời gian tối đa 25 phút, không sử dụng từ điển hay công cụ hỗ trợ - 25 phút\n- Bước 2: Đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 5 phút\n- Bước 3: Chữa bài: Vào Tập tin,  xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình\n", "deadline": "", "url": "https://drive.google.com/drive/folders/10qyab37ke4WZQlQrP2vrSyZPDdVioghv?usp=drive_link"}, {"row": 47, "week": "5.0", "session": "", "homework": "19.0", "title": "RC 10: Part 7 đơn", "kind": "homework", "content": "I. LC (75 phút)\n1. Nộp ảnh chụp bài Làm + Chữa 4 đoạn Part 3 (BTVN 19)\n- Bước 1 - Làm bài: Nghe 1 lần liên tục 4 đoạn, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 10 phút\n- Bước 2 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết - 35 phút\n+ Highlight từ khóa ở câu hỏi (Từ để hỏi + S + V)\n+ Tra phiên âm & nghĩa từ mới của câu hỏi & đáp án vào giáo trình\n+ Mở phần đáp án cuối giáo trình -> Highlight, tra phiên âm, dịch nghĩa từ mới\n+ Nghe lại audio và CHIA CỤM + ĐÁNH DẤU CHỖ NỐI ÂM \n+ Ghi rõ keywords để trả lời cho câu hỏi bên cạnh đáp án đúng\n\n2. Nộp 4 video chỉ vào giáo trình bản Pdf trắng (không take note) -> Dịch nghĩa 3 câu hỏi + toàn bộ đáp án của 4 đoạn (mỗi đoạn <30s) - 5 phút\n\n3. Nộp video NGHE NHẮC LẠI + TÓM TẮT Đoạn 1 (Câu 44-46) của BTVN 19\n- Bước 1 - Luyện tập: \n+ TEXT: Bật file nghe và nhắc lại từng câu có nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n+ NO TEXT: Bật file nghe và nhắc lại từng câu KHÔNG nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n\n- Bước 2 - Quay video: \n+ Quay video nghe, nhắc lại và dịch nghĩa từng câu (đảm bảo tiêu chí: 1 HƠI, NHẮC LẠI TIẾNG ANH & DỊCH TIẾNG VIỆT, KHÔNG NHÌN GIẤY)\n+ Tóm tắt đoạn hội thoại theo 4Ps ở cuối video \n\nII. RC (100 phút)\n1. Nộp ảnh chụp bài chữa 3/6 đoạn + Nộp video dịch 3/6 đoạn của 6 đoạn Part 7 (BTVN 19)\n- Bước 1 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình (Áp dụng với tối thiểu 3 đoạn khó/ sai nhiều nhất) - 20 phút\n- Bước 2 - Luyện dịch 3 đoạn vừa chữa - 30 phút\n- Bước 3 - Quay video 3 đoạn vừa luyện. Lưu ý: Chỉ tay vào giáo trình bản PDF trắng (không take note) - 15 phút\n", "deadline": "23h ngày", "url": "https://drive.google.com/drive/folders/1lIT3xDmHtzRRl0fhLx1yzV8AG3QMYMSl?usp=drive_link"}, {"row": 48, "week": "5.0", "session": "", "homework": "20.0", "title": "Demo Test 2", "kind": "test", "content": "\n1. Nộp ảnh chụp bài Làm FULL ETS 2022 - Test 2 trong vòng 120 phút không nghỉ & tự chữa lại các câu sai\n- Truy cập vào đường link, BẮT BUỘC đăng nhập để lưu lịch sử làm bài \n- Bấm \"Bắt đầu\" và làm trong 2 tiếng không nghỉ, hông sử dụng từ điển hay công cụ hỗ trợ\n- Cap màn hình Full điểm các part và nộp ảnh lên -> nhập số câu đúng vào Sheet Theo dõi bài tập \n- Tự chữa lại các câu sai ra vở\n\n2. Nộp ảnh chụp bài chữa 5/10 đoạn (áp dụng với đoạn sai nhiều nhất/ khó) của 10 đoạn Bài tập thực hành Part 7 trong Lesson 11 - Reading\nVào Tập tin của Khóa học trên Canvas LMS, xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình- 50 phút\n", "deadline": "23h ngày", "url": "https://zenlishtoeic.vn/stm-quizzes/test-2-ets-2022/"}, {"row": 49, "week": "6.0", "session": "Lesson 16", "homework": "", "title": "RC 11: Part 7 đơn", "kind": "lesson", "content": "Nộp ảnh chụp giáo trình phần làm 10 đoạn Bài tập thực hành Part 7 trong Lesson 11 - Reading\n- Bước 1: Chọn đáp án trong thời gian tối đa 30 phút, không sử dụng từ điển hay công cụ hỗ trợ - 30 phút\n- Bước 2: Đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 5 phút\n- Bước 3: Chữa bài: Vào Tập tin,  xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình\n", "deadline": "", "url": "https://drive.google.com/drive/folders/1C8ZxPXEGbJIFRBvlEtfDmkTLNcJpM6c3?usp=drive_link"}, {"row": 50, "week": "6.0", "session": "", "homework": "21.0", "title": "RC 11: Part 7 đơn", "kind": "homework", "content": "\nII. RC (105 phút)\n1. Nộp ảnh chụp bài Chữa 3/6 đoạn + Nộp video dịch 3/6 đoạn của 6 đoạn Part 7 (BTVN 21)\n- Bước 1 - Chữa bài: Vào Tập tin , xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình (Áp dụng với tối thiểu 3 đoạn khó/sai nhiều nhất) - 20 phút\n- Bước 2 - Luyện dịch 3 đoạn vừa chữa - 30 phút\n- Bước 3 - Quay video 3 đoạn vừa luyện. Lưu ý: Chỉ tay vào giáo trình bản PDF trắng (không take note) - 15 phút\n\n", "deadline": "23h ngày", "url": "https://drive.google.com/drive/folders/1U26rkpoX_plMaFe9UR6mmwK_uW7AeEyQ?usp=drive_link"}, {"row": 51, "week": "6.0", "session": "Lesson 17", "homework": "", "title": "LC 6: Part 4 (1): Luyện đề", "kind": "lesson", "content": "1. Giới thiệu Part 4\n- Gồm 30 câu – 10 đoạn độc thoại.\n+ Mỗi đoạn có 3 câu hỏi, thứ tự câu hỏi theo diễn biến đoạn độc thoại.\n+ Mục tiêu: 24/30 câu\n- 5 dạng câu hỏi phổ biến (tương tự Part 3, nói nhanh phần này):\n+ Dạng 1: Hỏi về ý chính (Main Idea): Hỏi về mục đích chính của đoạn hội thoại hoặc bài nói.\n+ Dạng 2: Hỏi chi tiết (Details): Hỏi về các thông tin cụ thể như ngày, giờ, địa điểm, hoặc tên.\n+ Dạng 3: Hỏi suy luận (Inference): Hỏi về thông tin gián tiếp, yêu cầu suy luận từ những gì được nghe.\n+ Dạng 4: Hỏi về chức năng (Function/Purpose): Hỏi về lý do cụ thể của lời nói trong đoạn hội thoại hoặc bài nói.\n+ Dạng 5: Hỏi về hình ảnh (Chart/Graph Questions): Liên kết thông tin trong đoạn hội thoại với biểu đồ hoặc lịch trình đi kèm.\n- Các chủ đề nội dung thường gặp (tương tự Part 3, nói nhanh phần này):\n+ Công việc: Hội thoại về lịch họp, dự án, khách hàng.\n+ Cuộc sống hằng ngày: Đặt chỗ nhà hàng, mua vé, gọi dịch vụ.\n+ Vấn đề cần giải quyết: Trục trặc kỹ thuật, phàn nàn, thay đổi lịch trình.\n+ Biểu đồ: Lịch họp, hóa đơn, danh sách công việc.\n\n2. 6 bước luyện nghe PART 4\nBước 1: Dịch câu hỏi và câu trả lời để đảm bảo BIẾT HẾT và HIỂU HẾT.\nBước 2: Nghe và chọn đáp án.\nBước 3: Tra phiên âm từ mới hoặc có nối âm thì note lại.\nBước 4: Dịch để HIỂU HẾT nội dung của cả đoạn hội thoại (có file mềm dịch sẵn rồi chỉ việc đọc lại thôi)\nBước 5: LUYỆN TẬP NGHE NHẮC LẠI\n- 5.1 Nhìn TEXT, Nghe và đọc lại từng câu trôi chảy (20 lần/ câu) cho tới khi thuộc và hiểu mà không cần nhìn text. Làm lần lượt từng câu đến hết bài.\n- 5.2 Nghe lại 1 lần nữa KHÔNG NHÌN TEXT để đảm bảo đã hiểu hết 100% (nếu chưa nghe hiểu hết thì quay lại B3, 4, 5.1)\nBước 6: QUAY VIDEO\nQuay video theo hình thức NGHE và NHẮC LẠI và DỊCH TỪNG CÂU cả tiếng Anh và tiếng Việt. (KHÔNG CẦN HỌC THUỘC LÒNG NHƯ PART 3).\nBí mật: Để đạt mục tiêu 450 – 500 TOEIC, chúng ta cần quay video nghe nhắc lại và dịch ít nhất 20 đoạn.\n\n3. Thực hành\nNộp ảnh chụp bài Làm + Chữa Bài thực hành Part 4 trong Lesson 6 - Listening (Không làm Actual Test 1)\n- Bước 1 - Làm bài: Nghe 1 lần, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 20 phút\n- Bước 2 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết (Áp dụng với 6 đoạn sai nhiều nhất) - 50 phút\n+ Highlight từ khóa ở câu hỏi (Từ để hỏi + S + V)\n+ Tra phiên âm & nghĩa từ mới của câu hỏi & đáp án vào giáo trình\n+ Mở phần đáp án cuối giáo trình -> Highlight, tra phiên âm, dịch nghĩa từ mới\n+ Nghe lại audio và CHIA CỤM + ĐÁNH DẤU CHỖ NỐI ÂM \n+ Ghi rõ keywords để trả lời cho câu hỏi bên cạnh đáp án đúng\n\n", "deadline": "", "url": "https://drive.google.com/drive/folders/1rgsr-jsEFe1JNmdSQ1ovvOu9cuyyJE-t?usp=drive_link"}, {"row": 52, "week": "6.0", "session": "", "homework": "22.0", "title": "LC 6: Part 4 (1): Luyện đề", "kind": "homework", "content": "I. LC (75 phút)\n1. Nộp ảnh chụp bài Làm + Chữa 4 đoạn Part 4 (BTVN 22) \n- Bước 1 - Làm bài: Nghe 1 lần liên tục 4 đoạn, chọn đáp án -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 10 phút\n- Bước 2 - Chữa bài: Vào Tập tin , xem video giải thích chi tiết - 35 phút\n+ Highlight từ khóa ở câu hỏi (Từ để hỏi + S + V)\n+ Tra phiên âm & nghĩa từ mới của câu hỏi & đáp án vào giáo trình\n+ Mở phần đáp án cuối giáo trình -> Highlight, tra phiên âm, dịch nghĩa từ mới\n+ Nghe lại audio và CHIA CỤM + ĐÁNH DẤU CHỖ NỐI ÂM \n+ Ghi rõ keywords để trả lời cho câu hỏi bên cạnh đáp án đúng\n\n2. Nộp 4 video chỉ vào giáo trình bản Pdf trắng (không take note) -> Dịch nghĩa 3 câu hỏi + toàn bộ đáp án của 4 đoạn (mỗi đoạn <30s) - 5 phút\n\n3. Nộp video NGHE NHẮC LẠI + TÓM TẮT Đoạn 1 (Câu 71-73) của BTVN 22\n- Bước 1 - Luyện tập: \n+ TEXT: Bật file nghe và nhắc lại từng câu có nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n+ NO TEXT: Bật file nghe và nhắc lại từng câu KHÔNG nhìn text (tối thiểu 5 lần/ câu) cho tới khi trôi chảy\n\n- Bước 2 - Quay video: \n+ Quay video nghe, nhắc lại và dịch nghĩa từng câu (đảm bảo tiêu chí: 1 HƠI, NHẮC LẠI TIẾNG ANH & DỊCH TIẾNG VIỆT, KHÔNG NHÌN GIẤY)\n+ Tóm tắt đoạn hội thoại theo 4Ps ở cuối video \n\nII. RC (115 phút)\n1. Nộp ảnh chụp bài Làm 6/6 đoạn + Nộp ảnh chụp bài Chữa 3/6 đoạn + Nộp video dịch 3/6 đoạn của 6 đoạn Part 7 (BTVN 22)\n- Bước 1 - Làm bài: Chọn đáp án trong thời gian tối đa 25 phút, không sử dụng từ điển hay công cụ hỗ trợ -> đếm số câu đúng và điền điểm vào Sheet Theo dõi bài tập - 25 phút\n- Bước 2 - Chữa bài: Vào Tập tin, xem video giải thích chi tiết và chữa theo + ghi chú vào giáo trình (Áp dụng với tối thiểu 3 đoạn khó/sai nhiều nhất) - 30 phút\n- Bước 3 - Luyện dịch 3 đoạn vừa chữa - 20 phút\n- Bước 4 - Quay video dịch 3 đoạn vừa luyện. Lưu ý: Chỉ tay vào giáo tr const $=s=>document.querySelector(s);
/* ===================== Chế độ tối · in · nhớ vị trí ===================== */
const KEY='campbomb.v1';
let memS=null;
function loadState(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return memS||{}}}
const S={pos:{},last:null,theme:null};
(function(){const o=loadState();if(o.pos&&typeof o.pos==='object')S.pos=o.pos;if(o.last!=null)S.last=o.last;if(o.theme)S.theme=o.theme})();
function save(){memS=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const byRow=new Map(DATA.items.map((it,i)=>[it.row,i]));
let curRow=null;

let toastT;
function toast(msg,label,act){const t=$('#toast'),b=$('#toastBtn');$('#toastMsg').textContent=msg;b.textContent=label;b.removeAttribute('data-view');b.removeAttribute('data-act');if(act==='home')b.dataset.view='home';else b.dataset.act=act;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},7000)}

function flushPos(){if(curRow==null)return;const y=Math.round(window.scrollY);if(y>150)S.pos[curRow]=y;else delete S.pos[curRow];save()}
let st,lastR=null,lastY=0;
function updScroll(){const y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight,rp=$('#rprog');
 if(curRow!=null&&h>200){rp.classList.add('on');rp.firstElementChild.style.width=Math.min(100,y/h*100)+'%'}else rp.classList.remove('on');
 $('#toTop').hidden=y<700}
addEventListener('scroll',()=>{updScroll();if(curRow==null)return;lastR=curRow;lastY=Math.round(window.scrollY);clearTimeout(st);st=setTimeout(()=>{if(lastY>150)S.pos[lastR]=lastY;else delete S.pos[lastR];save()},250)},{passive:true});

const QR_KIND=[[/video/i,'red','🎬'],[/quizlet/i,'violet','🃏'],[/bài tập|sheet/i,'green','📝'],[/từ điển|dictionary/i,'orange','📖'],[/luyện thi|thi thật/i,'blue','🎯'],[/tự học/i,'teal','🌱'],[/audio/i,'pink','🎧']];
function hostLabel(u){try{const h=new URL(u);if(h.hostname==='drive.google.com')return /folders/.test(h.pathname)?'Google Drive · Thư mục':'Google Drive';if(h.hostname==='docs.google.com')return /spreadsheets/.test(h.pathname)?'Google Sheets':'Google Docs';return h.hostname.replace(/^www\./,'')}catch(e){return ''}}
function buildQuick(){$('#quickResources').innerHTML=DATA.resources.slice(0,5).map((r,i)=>{const k=QR_KIND.find(x=>x[0].test(r.name))||[0,'indigo','📚'],m=r.name.match(/^(.*?)\s*\((.*)\)\s*$/),title=m?m[1]:r.name,desc=m?m[2]:'';
 return `<a class="qr c-${k[1]}" style="--i:${i}" href="${escapeHTML(r.url)}" target="_blank" rel="noopener"><span class="qr-ico">${k[2]}</span><span class="qr-tx"><b>${escapeHTML(title)}</b>${desc?`<small>${escapeHTML(desc)}</small>`:''}<em>${escapeHTML(hostLabel(r.url))}</em></span><span class="go">↗</span></a>`}).join('')}

/* ===================== Tìm kiếm ===================== */
const nfc=s=>String(s??'').normalize('NFC');
const fold=s=>{let o='';for(const c of nfc(s)){let l=c.toLowerCase();if(l.length!==c.length)l=c;if(l==='đ'){o+='d';continue}const d=l.normalize('NFD');o+=(l.length===1&&d.length>1)?d[0]:l}return o};
const toks=q=>fold(q).trim().split(/\s+/).filter(Boolean);
const hkOf=tk=>{const f=tk.filter(k=>k.length>1);return f.length?f:tk};
let IDX=null,RIDX=null;
function buildIdx(){IDX=DATA.items.map((it,i)=>{const t=nfc(it.title),tag=nfc(tagOf(it)),wk=nfc(weekLabel(weekKey(it))),c=nfc(it.content).replace(/\s+/g,' ');return{i,t,ft:fold(t),tag,ftag:fold(tag),fwk:fold(wk),c,fc:fold(c)}});
 RIDX=DATA.resources.map((r,i)=>({i,n:nfc(r.name),fn:fold(r.name)}))}
function scoreItem(x,tk){let sc=0;for(const k of tk){const a=x.ft.indexOf(k),b=x.ftag.indexOf(k),w=x.fwk.indexOf(k),c=x.fc.indexOf(k);if(a<0&&b<0&&w<0&&c<0)return 0;
  if(a>=0)sc+=10+(a===0||x.ft[a-1]===' '?4:0);if(b>=0)sc+=6;if(w>=0)sc+=4;if(c>=0)sc+=2}
 const ph=tk.join(' ');if(tk.length>1){if(x.ft.includes(ph))sc+=12;if(x.ftag.includes(ph))sc+=14}return sc}
function hlRange(text,ft,tk,a=0,b=text.length,ws=false){const r=[];for(const k of tk){let j=ft.indexOf(k,a);while(j>=0&&j<b){if(ws&&j>0&&/[a-z0-9]/.test(ft[j-1])){j=ft.indexOf(k,j+1);continue}r.push([j,Math.min(j+k.length,b)]);j=ft.indexOf(k,j+k.length)}}
 r.sort((x,y)=>x[0]-y[0]);const m=[];for(const x of r){const l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push([x[0],x[1]])}
 let o='',pos=a;for(const [s0,e] of m){o+=escapeHTML(text.slice(pos,s0))+'<mark>'+escapeHTML(text.slice(s0,e))+'</mark>';pos=e}return o+escapeHTML(text.slice(pos,b))}
function snippet(x,tk){let p=-1;for(const k of tk){const j=x.fc.indexOf(k);if(j>=0&&(p<0||j<p))p=j}if(p<0)return '';
 let a=Math.max(0,p-45),b=Math.min(x.c.length,p+110);if(a>0){const s0=x.c.indexOf(' ',a);if(s0>=0&&s0<p)a=s0+1}if(b<x.c.length){const e=x.c.lastIndexOf(' ',b);if(e>p)b=e}
 return (a>0?'… ':'')+hlRange(x.c,x.fc,hkOf(tk),a,b)+(b<x.c.length?' …':'')}
function applyHl(tk){const root=$('#content');tk=hkOf(tk);if(!root||!tk.length)return 0;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('button,script,style,mark,.eyebrow,.badge,.tag,.chip')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);let n=0;
 nodes.forEach(nd=>{const text=nfc(nd.nodeValue),ft=fold(text);const hh=hlRange(text,ft,tk,0,text.length,true);if(!hh.includes('<mark>'))return;const sp=document.createElement('span');sp.innerHTML=hh.replace(/<mark>/g,'<mark class="hl">');n+=sp.querySelectorAll('mark').length;nd.replaceWith(...sp.childNodes)});
 return n}

const SUGGEST=['Part 1','Part 5','Part 7','BTVN','Demo Test','Middle Test','Final Test','Từ loại'];
let searchOpen=false;
const sInp=()=>$('#search'),sBox=()=>$('#searchRes');
function placeRes(){const box=sBox(),r=$('.searchbox').getBoundingClientRect(),W=innerWidth,w=Math.min(580,W-20);
 box.style.width=w+'px';box.style.left=Math.max(10,Math.min(r.right-w,W-w-10))+'px';box.style.top=(r.bottom+8)+'px';box.style.maxHeight=Math.max(220,innerHeight-r.bottom-24)+'px'}
function closeRes(){searchOpen=false;sBox().hidden=true;sInp().setAttribute('aria-expanded','false')}
function renderRes(q){const box=sBox();if(!searchOpen){box.hidden=true;return}if(!IDX)buildIdx();const tk=toks(q);let html='';
 if(!tk.length){html=`<div class="sr-list"><div class="sr-h">Gợi ý tìm kiếm</div><div class="sr-chips">${SUGGEST.map(x=>`<button type="button" class="sr-chip" data-q="${escapeHTML(x)}">${escapeHTML(x)}</button>`).join('')}</div><div class="sr-tip">Gõ không dấu vẫn tìm được, ví dụ “tu loai”, “luyen de”.</div></div>`}
 else{const hk=hkOf(tk);
  const items=IDX.map(x=>({x,s:scoreItem(x,tk)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s||a.x.i-b.x.i);
  const res=RIDX.filter(r=>tk.every(k=>r.fn.includes(k)));
  const MAXI=8,shown=items.slice(0,MAXI);let ai=0;
  const row=o=>{const x=o.x,it=DATA.items[x.i];return `<button type="button" class="sr${ai++===0?' active':''}" role="option" data-index="${x.i}"><span class="sr-top"><span class="badge ${it.kind}">${escapeHTML(x.tag)}</span><span>${escapeHTML(weekLabel(weekKey(it)))}</span>${it.deadline?`<span>· ⏰ ${escapeHTML(it.deadline)}</span>`:''}</span><span class="sr-t">${hlRange(x.t,x.ft,hk)}</span>${(()=>{const sn=snippet(x,tk);return sn?`<span class="sr-s">${sn}</span>`:''})()}</button>`};
  if(!items.length&&!res.length)html=`<div class="sr-empty">Không tìm thấy kết quả cho <b>“${escapeHTML(q.trim())}”</b>.<br>Thử bớt từ khóa hoặc gõ ngắn hơn, ví dụ “part 5” hay “btvn”.</div>`;
  else{html='<div class="sr-list">';
   if(items.length)html+=`<div class="sr-h">Bài học · ${items.length}</div>`+shown.map(row).join('')+(items.length>MAXI?`<div class="sr-tip" style="padding-top:8px">Còn ${items.length-MAXI} kết quả khác — gõ thêm từ khóa để thu hẹp.</div>`:'');
   if(res.length)html+=`<div class="sr-h">Tài liệu · ${res.length}</div>`+res.slice(0,4).map(r=>`<a class="sr${ai++===0?' active':''}" role="option" href="${escapeHTML(DATA.resources[r.i].url)}" target="_blank" rel="noopener"><span class="sr-top"><span>📄 Tài liệu lớp học</span></span><span class="sr-t">${hlRange(r.n,r.fn,hk)} ↗</span></a>`).join('');
   html+='</div>'}
  html+=`<div class="sr-foot"><span class="sr-keys">↑↓ chọn · Enter mở · Esc đóng</span><span>${items.length+res.length} kết quả</span></div>`}
 box.innerHTML=html;box.hidden=false;sInp().setAttribute('aria-expanded','true');placeRes()}
function moveActive(d){const l=[...sBox().querySelectorAll('.sr')];if(!l.length)return;let i=l.findIndex(e=>e.classList.contains('active'));l[i]&&l[i].classList.remove('active');i=(i+d+l.length)%l.length;l[i].classList.add('active');l[i].scrollIntoView({block:'nearest'})}
function search(q){if(!IDX)buildIdx();const tk=toks(q);
 document.querySelectorAll('.wk').forEach(w=>{let any=false;w.querySelectorAll('.lesson-link').forEach(b=>{const ok=!tk.length||scoreItem(IDX[Number(b.dataset.index)],tk)>0;b.style.display=ok?'flex':'none';if(ok)any=true});w.style.display=any?'':'none';if(tk.length&&any)w.open=true});
 $('.searchbox').classList.toggle('has',!!String(q).length);renderRes(q)}
(function(){const inp=sInp();
 inp.addEventListener('focus',()=>{searchOpen=true;renderRes(inp.value)});

  else if(e.key==='Escape'){if(searchOpen)closeRes();else if(inp.value){inp.value='';search('')}else inp.blur()}});
 document.addEventListener('keydown',e=>{const tg=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable;
  if((e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();inp.focus();inp.select()}});

/* hiệu ứng đổi sáng/tối: vòng tròn loe ra từ nút (View Transitions), fallback: mờ chuyển màu */
function switchTheme(t,btn){
 const D=1100,EASE='cubic-bezier(.4,0,.2,1)',root=document.documentElement;
 const spin=()=>{const b=$('#themeBtn');if(b&&b.animate)b.animate([{transform:'rotate(-120deg) scale(.4)',opacity:0},{transform:'rotate(0) scale(1)',opacity:1}],{duration:800,easing:'cubic-bezier(.2,.8,.2,1)'})};
 const r=btn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,
  rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 /* sóng biển: các vòng sóng lan theo mép vòng tròn + các nút/thẻ nhấp nhô khi sóng đi qua */
 const bez=(x1,y1,x2,y2)=>p=>{let lo=0,hi=1,s=p;for(let k=0;k<24;k++){s=(lo+hi)/2;const px=3*(1-s)*(1-s)*s*x1+3*(1-s)*s*s*x2+s*s*s;if(px<p)lo=s;else hi=s}return 3*(1-s)*(1-s)*s*y1+3*(1-s)*s*s*y2+s*s*s};
 const ease=bez(.4,0,.2,1),inv=v=>{let lo=0,hi=1;for(let k=0;k<24;k++){const m=(lo+hi)/2;if(ease(m)<v)lo=m;else hi=m}return lo};
 const WSEL='.toolbar-btn,.nav-item,.lesson-link,.wk summary,.row,.resource,.fchip,.toc-chip,.pg,.rail button,.sr-chip,.qr,.panel-link,.lk-copy,.detail-card,.stat,.brand,.logo,.section-title,.goal-card,.wkc';
 /* đo vị trí + tính độ trễ MỘT LẦN, trước khi đổi giao diện (tránh giật ở khung hình đầu) */
 const items=[];document.querySelectorAll(WSEL).forEach(el=>{const b=el.getBoundingClientRect();if(!b.width||b.bottom<0||b.top>innerHeight||b.right<0||b.left>innerWidth)return;
  items.push({el,delay:inv(Math.min(1,Math.hypot(b.left+b.width/2-x,b.top+b.height/2-y)/rad))*D,big:b.width>300||b.height>160})});
 let ov=null,rings=[];
 const build=()=>{ov=document.createElement('div');ov.setAttribute('aria-hidden','true');ov.style.cssText='position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:99999;contain:strict';
  const c=t==='dark'?'160,150,255':'91,75,240';
  [.55,.38,.24].forEach(a=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:${x-rad}px;top:${y-rad}px;width:${2*rad}px;height:${2*rad}px;border-radius:50%;border:3px solid rgba(${c},${a});box-shadow:0 0 0 9px rgba(${c},${a*.18});transform:scale(0);opacity:0;will-change:transform,opacity`;ov.appendChild(d);rings.push(d)});
  document.body.appendChild(ov)};
 const go=()=>{if(!ov)return;
  rings.forEach((d,k)=>d.animate([{transform:'scale(0)',opacity:1},{transform:'scale(1)',opacity:0}],{duration:D*1.15,delay:k*150,easing:EASE,fill:'both'}));
  items.forEach(({el,delay,big})=>{try{el.animate(big?[{transform:'translateY(0)'},{transform:'translateY(-5px)',offset:.38},{transform:'translateY(2px)',offset:.7},{transform:'translateY(0)'}]:[{transform:'translateY(0) scale(1)'},{transform:'translateY(-9px) scale(1.06)',offset:.38},{transform:'translateY(3px) scale(.985)',offset:.7},{transform:'translateY(0) scale(1)'}],{duration:850,delay,easing:'cubic-bezier(.3,.6,.3,1)',fill:'backwards'})}catch(_){}});
  setTimeout(()=>{ov&&ov.remove();ov=null;rings=[]},D*1.15+500+D*.3)};
 /* tạm tắt hiệu ứng nặng (làm mờ nền, ánh sáng chạy) trong lúc chuyển */
 root.classList.add('vt-run');clearTimeout(switchTheme._v);switchTheme._v=setTimeout(()=>root.classList.remove('vt-run'),D+950);
 if(document.startViewTransition){
  const vt=document.startViewTransition(()=>{applyTheme(t);spin();build()});
  vt.ready.then(()=>{root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:D,easing:EASE,pseudoElement:'::view-transition-new(root)'});go()}).catch(()=>{});
  return}
 root.classList.add('theme-anim');applyTheme(t);spin();build();go();
 clearTimeout(switchTheme._t);switchTheme._t=setTimeout(()=>root.classList.remove('theme-anim'),800)}

 const mv=e=>{const el=e.target.closest&&e.target.closest(SEL);if(!el||el.contains(e.relatedTarget))return;pos(el,e,'--x','--y')};
 document.addEventListener('pointerover',mv,true);document.addEventListener('pointerout',mv,true);

  try{el.animate([{'--rr':'-10%','--ra':'32%'},{'--rr':'100%','--ra':'0%'}],{duration:1100,easing:'cubic-bezier(.2,.7,.2,1)'})}catch(_){}},true)})();

/* thẻ "Tài liệu / bài tập liên quan": nhận diện loại link, icon + màu riêng, nút sao chép */
function linkInfo(u){let x;try{x=new URL(u)}catch(e){return{ico:'🔗',c:'teal',tag:'Liên kết',title:'Mở liên kết',disp:u}}
 const h=x.hostname.replace(/^www\./,''),p=x.pathname.replace(/\/$/,''),disp=h+(p&&p!=='/'?p:'');let r;
 if(h==='drive.google.com'&&/\/folders\//.test(p))r=['📁','orange','Google Drive · Thư mục','Mở thư mục tài liệu'];
 else if(h==='drive.google.com')r=['📄','blue','Google Drive · Tệp','Mở tài liệu đính kèm'];
 else if(h==='docs.google.com'&&/spreadsheets/.test(p))r=['📊','green','Google Sheets','Mở bảng tính'];
 else if(h==='docs.google.com'&&/presentation/.test(p))r=['🖼️','orange','Google Slides','Mở bài thuyết trình'];
 else if(h==='docs.google.com')r=['📝','blue','Google Docs','Mở tài liệu'];
 else if(/youtu/.test(h))r=['🎬','red','YouTube · Video','Xem video hướng dẫn'];
 else if(/zenlishtoeic\.vn$/.test(h)&&/quiz/.test(p))r=['✍️','violet','Zenlish · Bài kiểm tra','Làm bài kiểm tra trực tuyến'];
 else if(/zenlishtoeic\.vn$/.test(h))r=['🎓','violet','Zenlish','Mở trang Zenlish'];
 else r=['🔗','teal',h,'Mở liên kết'];
 return{ico:r[0],c:r[1],tag:r[2],title:r[3],disp}}
function linkCard(u){const i=linkInfo(u),e=escapeHTML;
 return `<div class="detail-card"><h2>🔗 Tài liệu / bài tập liên quan</h2><div class="lkrow"><a class="resource lk c-${i.c}" href="${e(u)}" target="_blank" rel="noopener"><span class="ico lk-ico">${i.ico}</span><span class="lk-tx"><em>${e(i.tag)}</em><b>${e(i.title)}</b><small>${e(i.disp)}</small></span><span class="open"><span class="ot">Truy cập</span><i class="ar">↗</i></span></a><button type="button" class="lk-copy noprint" data-copy="${e(u)}" title="Sao chép liên kết" aria-label="Sao chép liên kết"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg><span>Sao chép</span></button></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;e.preventDefault();const u=b.dataset.copy,l=b.querySelector('span');
 const done=()=>{b.classList.add('ok');l.textContent='Đã chép';clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove('ok');l.textContent='Sao chép'},1800)};
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(done,()=>{const t=document.createElement('textarea');t.value=u;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove();done()})});

/* mục menu vừa được chọn: nền tím loe ra từ điểm vừa bấm */
(function(){const root=document.querySelector('.app');if(!root||!window.MutationObserver)return;
 document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('.nav-item,.rail button,.lesson-link');if(el)el._pdAt=performance.now()},true);
 new MutationObserver(ms=>{for(const m of ms){const el=m.target;if(!el.classList||!el.classList.contains('active')||(m.oldValue||'').split(/\s+/).includes('active')||!el.matches('.nav-item,.rail button,.lesson-link')||!el.animate)continue;
  const fresh=el._pdAt&&performance.now()-el._pdAt<1500,px=fresh&&el.style.getPropertyValue('--px')||'50%',py=fresh&&el.style.getPropertyValue('--py')||'50%';
  try{el.animate([{clipPath:`circle(0% at ${px} ${py})`},{clipPath:`circle(160% at ${px} ${py})`}],{duration:650,easing:'cubic-bezier(.4,0,.2,1)'})}catch(_){}}
 }).observe(root,{subtree:true,attributes:true,attributeFilter:['class'],attributeOldValue:true})})();
function applyTheme(t){document.documentElement.dataset.theme=t;const b=$('#themeBtn');if(b){b.textContent=t==='dark'?'☀️':'🌙';b.title=t==='dark'?'Chế độ sáng':'Chế độ tối'}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#131729':'#5146e5'}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(!S.theme)applyTheme(e.matches?'dark':'light')});

document.addEventListener('click',e=>{
 if(e.target.closest('#themeBtn')){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();switchTheme(S.theme,e.target.closest('#themeBtn'));return}
 if(e.target.closest('#toTop')){window.scrollTo({top:0,behavior:'smooth'});return}

 else if(searchOpen&&!e.target.closest('.searchbox,#searchRes'))closeRes();

 if(a){const act=a.dataset.act;if(act==='print')doPrint();else if(act==='top')window.scrollTo({top:0,behavior:'smooth'})}

/* mở app: quay lại đúng bài (và chỗ) đang xem dở; chưa có thì vào Tổng quan */
function boot(){applyTheme(document.documentElement.dataset.theme||'light');
 const li=S.last!=null?byRow.get(S.last):undefined;
 if(li===undefined){renderHome();return}
 const r=selectIndex(li);
 if(r)toast('Đã mở lại đúng chỗ bạn đang xem dở','Lên đầu bài','top');else toast('Tiếp tục bài bạn đang xem dở','Tổng quan','home')}

const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linkify(t){return escapeHTML(t).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}
const num=v=>String(v||'').replace(/\.0+$/,'');
function labelFor(k){return ({prep:'Chuẩn bị',lesson:'Lesson',homework:'Bài tập về nhà',test:'Kiểm tra'})[k]||'Nội dung'}
function weekKey(it){return it.week?num(it.week):'0'}
function weekLabel(k){return k==='0'?'Khởi động':'Tuần '+k}
function tagOf(it){if(it.homework)return /^\d+$/.test(num(it.homework))?'BTVN '+num(it.homework):it.homework;if(it.session)return /^\d+$/.test(num(it.session))?(it.kind==='prep'?'Buổi 0':'Buổi '+num(it.session)):it.session;return labelFor(it.kind)}
function grouped(){const m=new Map();DATA.items.forEach((it,i)=>{const k=weekKey(it);if(!m.has(k))m.set(k,[]);m.get(k).push({...it,index:i})});return [...m.entries()]}
function buildNav(){$('#roadmapNav').innerHTML=grouped().map(([w,items])=>`<details class="wk" data-w="${w}"><summary>${weekLabel(w)}<small>${items.length} mục</small></summary>${items.map(it=>`<button class="lesson-link" data-index="${it.index}"><span class="dot k-${it.kind}"></span><span><small>${escapeHTML(tagOf(it))}</small>${escapeHTML(it.title)}</span></button>`).join('')}</details>`).join('')}
function _buildQuick(){$('#quickResources').innerHTML=DATA.resources.slice(0,5).map(r=>`<a class="panel-link" href="${escapeHTML(r.url)}" target="_blank" rel="noopener"><span class="file-ico">↗</span><span>${escapeHTML(r.name)}<small>Mở tài liệu</small></span></a>`).join('')}
function setCrumb(t){$('#crumbCurrent').textContent=t}
function _setActive(v){document.querySelectorAll('[data-view]').forEach(x=>{if(x.matches('.nav-item,.rail button'))x.classList.toggle('active',x.dataset.view===v)});document.querySelectorAll('.lesson-link').forEach(b=>b.classList.remove('active'))}

/* ---- Nội dung: tách phần, bước, gạch đầu dòng ---- */
function fmtLine(t){return linkify(t.replace(/\((\d+\s*phút)\)/g,'\u0001$1\u0002')).replace(/\u0001(.*?)\u0002/g,'<span class="chip">$1</span>')}
function renderBody(text){
 const secs=[{t:null,h:''}];let cur=secs[0];
 (text||'').split('\n').forEach(raw=>{
  const l=raw.trim();if(!l)return;let m;
  if(m=l.match(/^(I{1,3}|IV|V|VI)\.\s*(.+)$/)){cur={t:m[2],h:''};secs.push(cur)}
  else if(m=l.match(/^[-–\s]*(Bước\s*\d+)\s*[-:–]?\s*(.*)$/i))cur.h+=`<div class="step"><b>${escapeHTML(m[1])}</b><span>${fmtLine(m[2])}</span></div>`;
  else if(m=l.match(/^(\d+)\.\s+(.+)$/))cur.h+=`<h4><span class="n">${m[1]}</span><span>${fmtLine(m[2])}</span></h4>`;
  else if(m=l.match(/^\+\s*(.+)$/))cur.h+=`<div class="bl l2">${fmtLine(m[1])}</div>`;
  else if(m=l.match(/^[-•]\s*(.+)$/))cur.h+=`<div class="bl">${fmtLine(m[1])}</div>`;
  else cur.h+=/^\s{3,}/.test(raw)?`<div class="cont">${fmtLine(l)}</div>`:`<p>${fmtLine(l)}</p>`;
 });
 const out=secs.filter(x=>x.h).map(x=>`<div class="detail-card">${x.t?`<h2>${fmtLine(x.t)}</h2>`:''}<div class="body">${x.h}</div></div>`).join('');
 return out||'<div class="detail-card"><div class="empty">Tài liệu gốc không có nội dung ở mục này.</div></div>'}

function renderRoadmap(){setActive('roadmap');setCrumb('Toàn bộ lộ trình');$('#content').innerHTML=`<div class="eyebrow">ROADMAP</div><h1 class="page-title">Toàn bộ lộ trình Camp Bomb</h1><div class="sub">Bấm vào từng mục để xem hướng dẫn chi tiết. Chấm màu: <span class="badge">Lesson</span> <span class="badge homework">BTVN</span> <span class="badge test">Kiểm tra</span></div>
 <div class="tl">${grouped().map(([w,items])=>`<div class="wkc"><h3>${weekLabel(w)}<small>${items.length} mục</small></h3>${items.map(it=>`<button class="row" data-index="${it.index}"><span class="badge ${it.kind}">${escapeHTML(tagOf(it))}</span><span class="t">${escapeHTML(it.title)}</span>${it.deadline?`<span class="d">⏰ ${escapeHTML(it.deadline)}</span>`:''}</button>`).join('')}</div>`).join('')}</div>`}

function renderResources(){setActive('resources');setCrumb('Tài liệu lớp học');$('#content').innerHTML=`<div class="eyebrow">COURSE LIBRARY</div><h1 class="page-title">Tài liệu lớp học Camp Bomb TOEIC</h1><div class="sub">Danh sách tài liệu và công cụ được cung cấp trong kế hoạch gốc.</div><div class="resource-grid" style="margin-top:22px">${DATA.resources.map((r,i)=>`<a class="resource" href="${escapeHTML(r.url)}" target="_blank" rel="noopener"><span class="ico">${/youtube|video|Video/.test(r.name)?'🎬':/sheet|Quizlet|Bài tập/.test(r.name)?'📝':'📄'}</span><span><b>${escapeHTML(r.name)}</b><small>Tài liệu ${String(i+1).padStart(2,'0')}</small></span><span class="open">Truy cập ↗</span></a>`).join('')}</div>`}

function renderInfo(){setActive('info');setCrumb('Hướng dẫn & thông tin');
 const c=k=>DATA.items.filter(x=>x.kind===k).length,weeks=grouped().filter(g=>g[0]!=='0').length;
 $('#content').innerHTML=`<div class="eyebrow">THÔNG TIN</div><h1 class="page-title">Hướng dẫn &amp; thông tin khóa học</h1><div class="sub">Mọi thứ cần biết để dùng workspace này và theo kịp khóa học.</div>
 <div class="stats"><div class="stat"><b>${weeks}</b><span>Tuần học</span></div><div class="stat"><b>${c('lesson')}</b><span>Lesson</span></div><div class="stat"><b>${c('homework')}</b><span>Bài tập về nhà</span></div><div class="stat"><b>${c('test')}</b><span>Bài kiểm tra</span></div></div>
 <div class="detail-card"><h2>🎯 Mục tiêu điểm số</h2><table class="sc"><tr><th>Kỹ năng</th><th>Part 1</th><th>Part 2</th><th>Part 3</th><th>Part 4</th><th>Tổng câu đúng</th><th>Điểm</th></tr><tr><td><b>Listening</b></td><td>4</td><td>18</td><td>25</td><td>18</td><td>65/100</td><td>330</td></tr></table>
 <table class="sc" style="margin-top:6px"><tr><th>Kỹ năng</th><th>Part 5</th><th>Part 6</th><th>Part 7</th><th></th><th>Tổng câu đúng</th><th>Điểm</th></tr><tr><td><b>Reading</b></td><td>18</td><td>8</td><td>29</td><td></td><td>55/100</td><td>245</td></tr></table>
 <p class="body" style="margin:12px 0 0"><b>Tổng tối thiểu: 550/990</b> (330 + 245 = 575, đã gồm một khoảng dự phòng).</p></div>
 <div class="detail-card"><h2>🔁 Nhịp học mỗi tuần</h2><div class="body"><div class="bl">Học <b>Lesson</b>: xem video lý thuyết, ghi chép vào vở, làm bài thực hành trong buổi.</div><div class="bl">Làm <b>BTVN</b> sau mỗi Lesson: làm bài → chữa bài bằng video → nộp ảnh/video theo từng bước.</div><div class="bl">Nộp trước <b>deadline 23h</b> của ngày ghi trong mỗi bài.</div><div class="bl">Cuối khóa làm <b>bài kiểm tra</b> (FINAL TEST) với mục tiêu trên 550.</div></div></div>
 <div class="detail-card"><h2>🧭 Cách dùng workspace</h2><div class="body"><div class="bl"><b>Toàn bộ lộ trình</b> (▤): xem tất cả mục theo tuần, kèm deadline.</div><div class="bl">Menu trái: bấm tên tuần để mở/đóng danh sách bài; chấm màu cho biết loại bài.</div><div class="bl">Ô tìm kiếm: gõ từ khóa (VD "Part 5", "BTVN 3") để lọc nhanh bài học.</div><div class="bl">Trong mỗi bài có nút <b>Mục trước / Mục tiếp theo</b> để học liên tục.</div><div class="bl"><b>🌙 Chế độ tối</b> ở góc trên; <b>🖨 In bài này</b> trong từng bài; app nhớ bài và chỗ bạn đang xem dở khi mở lại.</div><div class="bl">Lần đầu học tại Zenlish: xem video hướng dẫn nộp BTVN trong mục <a href="#" data-view="prep">Chuẩn bị khóa</a>.</div></div></div>
 <div class="detail-card"><h2>🎨 Chú thích màu</h2><div class="body"><span class="badge prep">Chuẩn bị</span> <span class="badge">Lesson</span> <span class="badge homework">BTVN</span> <span class="badge test">Kiểm tra</span></div></div>`}

function renderDetail(it){setCrumb(it.title);const pos=DATA.items.indexOf(it),hasP=pos>0,hasN=pos<DATA.items.length-1;
 $('#content').innerHTML=`<div class="detail-head"><div><div class="eyebrow">${escapeHTML(labelFor(it.kind))} · ${weekLabel(weekKey(it)).toUpperCase()}</div><h1>${escapeHTML(it.title||'Nội dung học tập')}</h1><div class="detail-meta"><span class="badge ${it.kind}">${escapeHTML(tagOf(it))}</span>${it.deadline?`<span class="tag">⏰ Deadline: ${escapeHTML(it.deadline)}</span>`:''}</div></div></div>
 ${actionsHTML(it)}${renderBody(it.content)}
 ${it.url?linkCard(it.url):''}
 <div class="pager noprint">${hasP?`<button class="pg" data-prev="${pos-1}"><small>← Mục trước · ${escapeHTML(tagOf(DATA.items[pos-1]))}</small><b>${escapeHTML(DATA.items[pos-1].title)}</b></button>`:'<span></span>'}${hasN?`<button class="pg next" data-next="${pos+1}"><small>${escapeHTML(tagOf(DATA.items[pos+1]))} · Mục tiếp theo →</small><b>${escapeHTML(DATA.items[pos+1].title)}</b></button>`:'<span></span>'}</div>`;
 window.scrollTo(0,0);document.querySelector('.content').scrollIntoView()}
function renderPrep(){const it=DATA.items.find(x=>x.kind==='prep');if(it)selectIndex(DATA.items.indexOf(it));else renderHome()}
function _selectIndex(i){const it=DATA.items[i];if(!it)return;document.querySelectorAll('.nav-item,.rail button').forEach(x=>x.classList.remove('active'));renderDetail(it);
 document.querySelectorAll('.lesson-link').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===i));
 const w=document.querySelector(`.wk[data-w="${weekKey(it)}"]`);if(w)w.open=true;
 const a=document.querySelector('.lesson-link.active');if(a)a.scrollIntoView({block:'nearest'});
 if(innerWidth<=720)$('#sidebar').classList.remove('show')}
function _search(q){const t=q.trim().toLocaleLowerCase('vi');
 document.querySelectorAll('.wk').forEach(w=>{let any=false;w.querySelectorAll('.lesson-link').forEach(b=>{const it=DATA.items[Number(b.dataset.index)];const ok=!t||[it.title,it.content,tagOf(it)].join(' ').toLocaleLowerCase('vi').includes(t);b.style.display=ok?'flex':'none';if(ok)any=true});w.style.display=any?'':'none';if(t&&any)w.open=true})}
buildNav();buildQuick();boot();
document.addEventListener('click',e=>{
 const v=e.target.closest('[data-view]');if(v){e.preventDefault();const m={home:renderHome,roadmap:renderRoadmap,resources:renderResources,info:renderInfo,prep:renderPrep}[v.dataset.view];(m||renderHome)();if(innerWidth<=720)$('#sidebar').classList.remove('show');return}
 const l=e.target.closest('[data-index]');if(l){selectIndex(Number(l.dataset.index));return}
 const w=e.target.closest('[data-week]');if(w){e.preventDefault();const g=grouped().find(x=>x[0]===w.dataset.week);if(g)selectIndex(g[1][0].index);return}
 const n=e.target.closest('[data-next],[data-prev]');if(n){selectIndex(Number(n.dataset.next??n.dataset.prev));return}
});
$('#search').addEventListener('input',e=>search(e.target.value));$('#clearSearch').onclick=()=>{$('#search').value='';search('')};$('#backdrop').onclick=()=>$('#sidebar').classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('show')});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('show');
</script>
